<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatUE · Universidade de Évora</title>
  <link rel="icon" href="assets/icon-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try { if (!localStorage.getItem("chatue_session")) location.replace("login.html"); } catch (e) {}</script>
</head>
<body data-title="pageTitle">
  <header class="topbar">
    <img class="topbar-logo" data-logo="topbar" alt="">
    <span class="topbar-title">SIIUE</span>

    <div class="lang" id="lang">
      <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="lang-flag" id="langFlag"></span>
        <svg class="lang-caret" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 3.5h10L6 9z" fill="currentColor"/></svg>
        <span class="lang-tip" id="langTip" role="tooltip"></span>
      </button>
      <ul class="lang-menu" id="langMenu" role="menu" hidden></ul>
    </div>

    <div class="user" id="user">
      <button class="user-btn" id="userBtn" type="button" aria-haspopup="true" aria-expanded="false" data-i18n-aria="userMenuLabel">
        <span class="user-avatar" id="userAvatar"></span>
      </button>
      <div class="user-menu" id="userMenu" role="menu" hidden></div>
    </div>
  </header>

  <section class="hero">
    <img class="hero-logo" data-logo="hero" alt="">
    <h1 data-i18n="heroTitle"></h1>
  </section>

  <section class="stage">
    <div class="card">
      <div class="card-head" data-i18n="cardHead"></div>

      <div class="card-body">
        <img class="watermark" data-logo="watermark" alt="" aria-hidden="true">

        <main id="chat">
          <div class="wrap" id="messages">
            <div class="hello">
              <h2 data-i18n="helloTitle"></h2>
              <p data-i18n="helloText"></p>
            </div>
          </div>
        </main>

        <footer class="composer-area">
          <div class="chip" id="chip">
            <span id="chipName"></span>
            <button id="chipRemove" type="button" data-i18n="remove"></button>
          </div>

          <div class="composer">
            <input type="file" id="file" accept="image/*" hidden>
            <button class="icon-btn" id="attach" type="button" data-i18n-aria="attachLabel" hidden>+</button>

            <textarea id="input" rows="1" data-i18n-placeholder="placeholder" data-i18n-aria="messageLabel"></textarea>

            <button class="icon-btn" id="send" type="button" data-i18n-aria="sendLabel" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>

          <p class="note" data-i18n="note"></p>
        </footer>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <span data-i18n-html="footerRights"></span>
    <span data-i18n-html="footerSupport"></span>
    <span data-i18n-html="footerTech"></span>
  </footer>

  <!-- Ordem correta: config → api → common → app -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
