<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autenticação · SIIUE</title>
  <link rel="icon" href="assets/icon-logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>try { if (localStorage.getItem("chatue_session") && !location.hash) location.replace("index.html"); } catch (e) {}</script>
</head>
<body data-title="loginPageTitle">
  <header class="topbar">
    <img class="topbar-logo" data-logo="topbar" alt="">
    <span class="topbar-title">SIIUE</span>

    <div class="lang" id="lang">
      <button class="lang-btn" id="langBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="lang-flag" id="langFlag"></span>
        <svg class="lang-caret" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 3.5h10L6 9z" fill="currentColor"/></svg>
        <span class="lang-tip" id="langTip" role="tooltip"></span>
      </button>
      <ul class="lang-menu" id="langMenu" role="menu" hidden></ul>
    </div>
  </header>

  <section class="hero auth-hero">
    <img class="hero-logo" data-logo="hero" alt="">
    <h1 data-i18n="loginHeroTitle"></h1>
  </section>

  <section class="auth-stage">
    <div class="auth-card">
      <div class="card-head" id="authHead" data-i18n="authTitle"></div>

      <div class="auth-body">
        <!-- Coluna esquerda: login / registo -->
        <div class="auth-col">
          <form id="loginForm" class="auth-form" novalidate>
            <input class="auth-input" id="loginUser" name="username" type="text" autocomplete="username" data-i18n-placeholder="usernamePh" data-i18n-aria="usernamePh">
            <input class="auth-input" id="loginPass" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="passwordPh" data-i18n-aria="passwordPh">
            <p class="auth-error" id="loginError" role="alert" hidden></p>
            <button class="auth-btn" id="loginBtn" type="submit" data-i18n="loginBtn"></button>
            <button class="auth-link" id="forgotBtn" type="button" data-i18n="forgot"></button>
            <button class="auth-link strong" id="toRegister" type="button" data-i18n="registerLink"></button>
          </form>

          <form id="registerForm" class="auth-form" novalidate hidden>
            <input class="auth-input" id="regName" type="text" autocomplete="name" data-i18n-placeholder="namePh" data-i18n-aria="namePh">
            <input class="auth-input" id="regUser" type="text" autocomplete="username" data-i18n-placeholder="usernamePh" data-i18n-aria="usernamePh">
            <input class="auth-input" id="regEmail" type="email" autocomplete="email" data-i18n-placeholder="emailPh" data-i18n-aria="emailPh">
            <input class="auth-input" id="regPass" type="password" autocomplete="new-password" data-i18n-placeholder="passwordPh" data-i18n-aria="passwordPh">
            <input class="auth-input" id="regPass2" type="password" autocomplete="new-password" data-i18n-placeholder="confirmPh" data-i18n-aria="confirmPh">
            <p class="auth-error" id="registerError" role="alert" hidden></p>
            <button class="auth-btn" id="registerBtn" type="submit" data-i18n="registerBtn"></button>
            <button class="auth-link strong" id="toLogin" type="button" data-i18n="backToLogin"></button>
          </form>
        </div>

        <!-- Coluna direita: métodos externos -->
        <div class="auth-col auth-side">
          <button class="gov-btn" id="govBtn" type="button" aria-label="Autenticação.gov">
            <svg width="30" height="34" viewBox="0 0 30 34" aria-hidden="true"><path d="M22 4A15 15 0 1 0 22 30" fill="none" stroke="#1a5fb4" stroke-width="5" stroke-linecap="round"/><circle cx="21" cy="17" r="2.6" fill="#1a5fb4"/><circle cx="27" cy="12" r="1.8" fill="#4a8bd8"/><circle cx="27" cy="22" r="1.8" fill="#4a8bd8"/></svg>
            <span>AUTENTICAÇÃO.GOV</span>
          </button>
          <p class="auth-gov-text" data-i18n="govText"></p>

          <div class="auth-or"><span data-i18n="or"></span></div>

          <button class="google-btn" id="googleBtn" type="button">
            <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2.1 5.1-4.5 6.7v5.6h7.3c4.3-4 6.5-9.8 6.5-16.3z"/><path fill="#34A853" d="M24 46c6.1 0 11.2-2 14.9-5.5l-7.3-5.6c-2 1.4-4.6 2.2-7.6 2.2-5.8 0-10.8-3.9-12.5-9.2H4v5.8C7.7 41.1 15.3 46 24 46z"/><path fill="#FBBC05" d="M11.5 28c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2v-5.8H4C2.4 17 1.5 20.4 1.5 24s.9 7 2.5 10.2l7.5-6.2z"/><path fill="#EA4335" d="M24 10.6c3.3 0 6.2 1.1 8.5 3.3l6.4-6.4C35.2 4 30.1 2 24 2 15.3 2 7.7 6.9 4 14l7.5 5.800c1.700-5.300 6.700-9.200 12.500-9.200z"/></svg>
            <span data-i18n="googleBtn"></span>
          </button>
          <p class="auth-error" id="sideError" role="alert" hidden></p>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <span data-i18n-html="footerRights"></span>
    <span data-i18n-html="footerSupport"></span>
    <span data-i18n-html="footerTech"></span>
  </footer>

  <!-- Ordem correta: config → api → common → auth -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
